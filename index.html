<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CineTicket">
<title>CineTicket</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
<link rel="shortcut icon" href="favicon_io/favicon.ico">
<style>
:root{
  --bg:#07070b; --text:#f5f5f7; --dim:rgba(235,235,245,.55);
  --glass:rgba(255,255,255,.08); --glass-2:rgba(255,255,255,.14); --stroke:rgba(255,255,255,.16);
  --accent:#ff453a; --accent-2:#ff9f0a; --r:26px;
  --spring:cubic-bezier(.32,1.25,.5,1); --ease:cubic-bezier(.22,.8,.24,1);
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* Fondo ambiental */
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden}
.ambient i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.35;animation:drift 22s ease-in-out infinite alternate}
.ambient i:nth-child(1){background:#ff453a;top:-25vmax;left:-20vmax}
.ambient i:nth-child(2){background:#5e5ce6;bottom:-28vmax;right:-22vmax;animation-delay:-8s}
.ambient i:nth-child(3){background:#ff9f0a;width:30vmax;height:30vmax;top:40%;left:55%;opacity:.14;animation-delay:-14s}
@keyframes drift{to{transform:translate3d(8vmax,6vmax,0) scale(1.15)}}

.glass{background:var(--glass);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.12)}

/* Header */
header.top{position:sticky;top:0;z-index:20;padding:calc(var(--top) + 14px) 0 12px;background:linear-gradient(rgba(7,7,11,.82),rgba(7,7,11,.5));-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.hin{max-width:560px;margin:0 auto;padding:0 22px}.row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.hdr-blur{position:fixed;top:0;left:0;right:0;height:calc(var(--top) + 70px);z-index:19;pointer-events:none;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
header small{display:block;color:var(--dim);font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
h1{font-size:2.3rem;font-weight:800;letter-spacing:-.04em;line-height:1}
h1 b{background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;transition:transform .35s var(--spring)}
.icon-btn:active{transform:scale(.86)}
.hdr-actions{display:flex;gap:10px}
#install-btn{display:none;font-size:.95rem}

/* Lista */
main{max-width:560px;margin:0 auto;padding:6px 18px calc(var(--bot) + 60px);display:grid;gap:18px}
.card{position:relative;aspect-ratio:16/10;border-radius:var(--r);overflow:hidden;cursor:pointer;isolation:isolate;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.7);border:1px solid var(--stroke);
  opacity:0;transform:translateY(28px) scale(.97);animation:rise .7s var(--spring) forwards;animation-delay:calc(var(--i)*70ms);
  transition:transform .4s var(--spring)}
.card:active{transform:scale(.96)}
.card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 25%;z-index:-1;transition:transform 1.2s var(--ease)}
.card:hover>img{transform:scale(1.06)}
.card .meta{position:absolute;left:10px;right:10px;bottom:10px;padding:12px 16px;border-radius:20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.card .t{font-weight:700;font-size:1.08rem;letter-spacing:-.01em;line-height:1.15}
.card .s{color:var(--dim);font-size:.78rem;margin-top:3px}
.chip{flex:none;font-size:.72rem;font-weight:700;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.16)}
.noimg{position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,#2b2b3a,#14141c);display:grid;place-items:center;font-size:3rem}
@keyframes rise{to{opacity:1;transform:none}}

.empty{display:none;text-align:center;margin-top:16vh;padding:0 30px;animation:rise .8s var(--spring) forwards}
.empty .ico{font-size:4rem;display:inline-block;animation:float 3.5s ease-in-out infinite}
.empty h2{margin:14px 0 6px;font-size:1.35rem}.empty p{color:var(--dim);font-size:.95rem}
@keyframes float{50%{transform:translateY(-10px) rotate(-6deg)}}

/* Detalle */
#detail{position:fixed;inset:0;z-index:100;overflow-y:auto;overscroll-behavior:contain;visibility:hidden;opacity:0;transform:translateY(6%) scale(.94);
  transition:opacity .35s var(--ease),transform .5s var(--spring),visibility 0s .5s;background:var(--bg)}
#detail.on{visibility:visible;opacity:1;transform:none;transition-delay:0s}
.d-bg{position:fixed;inset:-10%;background-size:cover;background-position:center;filter:blur(60px) saturate(1.6) brightness(.55);transform:scale(1.2)}
.d-wrap{position:relative;max-width:560px;margin:0 auto;padding:calc(var(--top) + 70px) 22px calc(var(--bot) + 40px)}
.d-poster{width:min(62%,280px);margin:0 auto 26px;aspect-ratio:2/3;border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -10px rgba(0,0,0,.8),0 0 0 1px var(--stroke);background:#1c1c24;
  transform:perspective(900px) rotateX(8deg) scale(.9);opacity:0;transition:transform .8s var(--spring) .1s,opacity .5s .1s}
#detail.on .d-poster{transform:none;opacity:1}
.d-poster img{width:100%;height:100%;object-fit:cover;display:block}
.d-title{text-align:center;font-size:2rem;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-bottom:22px;text-shadow:0 2px 20px rgba(0,0,0,.5)}
.back{position:fixed;top:calc(var(--top) + 14px);left:18px;z-index:120;width:42px;height:42px;font-size:1.1rem}
.stagger>*{opacity:0;transform:translateY(20px);transition:opacity .5s var(--ease),transform .6s var(--spring)}
#detail.on .stagger>*{opacity:1;transform:none}
#detail.on .stagger>*:nth-child(1){transition-delay:.18s}#detail.on .stagger>*:nth-child(2){transition-delay:.26s}#detail.on .stagger>*:nth-child(3){transition-delay:.34s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pill{padding:14px 16px;border-radius:20px}
.pill.wide{grid-column:1/-1}
.pill span{display:block;color:var(--dim);font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.pill div{font-weight:700;font-size:1.05rem;word-break:break-word}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.btn{flex:1;padding:15px;border-radius:18px;font-weight:700;font-size:.95rem;transition:transform .3s var(--spring)}
.btn:active{transform:scale(.95)}
.btn.danger{color:#ff6961}
.btn.main{background:linear-gradient(120deg,var(--accent),#ff6a3d);color:#fff;box-shadow:0 10px 24px -8px rgba(255,69,58,.7)}
.btn.light{background:#fff;color:#000}
.btn:disabled{opacity:.5}

/* Entrada con muescas */
.ticket{position:relative;background:#fff;color:#000;border-radius:24px;padding:22px 22px 18px;text-align:center;cursor:pointer;overflow:hidden;
  -webkit-mask:radial-gradient(circle 13px at 0 46px,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 46px,#0000 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 13px at 0 46px,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 13px at 100% 46px,#0000 98%,#000) right/51% 100% no-repeat;
  transition:transform .4s var(--spring);box-shadow:0 20px 40px rgba(0,0,0,.4)}
.ticket:active{transform:scale(.97)}
.ticket .top{font-size:.68rem;font-weight:800;letter-spacing:.2em;color:#999;padding-bottom:16px;margin-bottom:16px;border-bottom:2px dashed #ddd}
.ticket img{width:min(72%,230px);aspect-ratio:1;object-fit:contain;display:block;margin:0 auto}
.ticket .hint{margin-top:12px;font-size:.68rem;font-weight:800;letter-spacing:.14em;color:#555}
.ticket.none img{display:none}

/* QR completo */
#qr-full{position:fixed;inset:0;z-index:300;background:#fff;display:grid;place-items:center;visibility:hidden;opacity:0;transition:opacity .3s,visibility 0s .3s}
#qr-full.on{visibility:visible;opacity:1;transition-delay:0s}
#qr-full img{width:min(92vw,520px);transform:scale(.8);transition:transform .5s var(--spring)}
#qr-full.on img{transform:none}
#qr-full p{position:absolute;bottom:calc(var(--bot) + 26px);color:#777;font-size:.75rem;font-weight:700;letter-spacing:.12em}

/* Asistente */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:flex-end;visibility:hidden;opacity:0;transition:opacity .3s,visibility 0s .4s}
.overlay.on{visibility:visible;opacity:1;transition-delay:0s}
.sheet{width:100%;max-width:560px;margin:0 auto;max-height:92vh;overflow-y:auto;border-radius:32px 32px 0 0;padding:14px 22px calc(var(--bot) + 24px);background:rgba(28,28,36,.72);transform:translateY(100%);transition:transform .55s var(--spring)}
.overlay.on .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.28);margin:0 auto 16px}
.sheet h3{font-size:1.4rem;letter-spacing:-.02em;margin-bottom:4px}
.sheet .sub{color:var(--dim);font-size:.88rem;margin-bottom:16px}
.dots{display:flex;gap:6px;margin:12px 0 18px}
.dots i{height:4px;flex:1;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.dots i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transform:translateX(-101%);transition:transform .5s var(--ease)}
.dots i.done::after{transform:none}
.step{display:none;flex-direction:column;gap:12px}
.step.on{display:flex;animation:stepIn .5s var(--spring)}
@keyframes stepIn{from{opacity:0;transform:translateX(30px)}}
input[type=text],input[type=number],input[type=search]{width:100%;padding:17px 18px;border-radius:16px;border:1px solid var(--stroke);background:rgba(255,255,255,.07);outline:0;font-size:1rem;transition:border-color .25s,background .25s,box-shadow .25s}
input:focus{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.11);box-shadow:0 0 0 4px rgba(255,69,58,.18)}
input::placeholder{color:rgba(235,235,245,.35)}
.row{display:flex;gap:10px}
.picker{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scroll-snap-type:x mandatory;scrollbar-width:none;min-height:0}
.picker::-webkit-scrollbar{display:none}
.picker button{flex:none;width:96px;aspect-ratio:2/3;border-radius:14px;overflow:hidden;scroll-snap-align:start;border:2px solid transparent;opacity:0;animation:rise .5s var(--spring) forwards;animation-delay:calc(var(--i)*60ms);transition:transform .3s var(--spring),border-color .2s}
.picker button.sel{border-color:var(--accent);transform:scale(1.05)}
.picker img{width:100%;height:100%;object-fit:cover;display:block}
.status{font-size:.82rem;color:var(--dim);min-height:1.2em;display:flex;align-items:center;gap:8px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.drop{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;border-radius:16px;border:1.5px dashed rgba(255,255,255,.28);color:var(--dim);font-weight:600;text-align:center;cursor:pointer;transition:background .2s,transform .3s var(--spring)}
.drop:active{transform:scale(.97)}.drop.ok{color:#30d158;border-color:#30d158;background:rgba(48,209,88,.08)}
.prev{display:none;width:120px;aspect-ratio:2/3;object-fit:cover;border-radius:14px;margin:0 auto;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.prev.on{display:block;animation:rise .5s var(--spring) forwards}
.qrprev{display:none;width:150px;height:150px;object-fit:contain;background:#fff;border-radius:16px;padding:8px;margin:0 auto}.qrprev.on{display:block}
.cancel{display:block;margin:14px auto 0;color:var(--dim);font-size:.9rem;padding:8px 16px}

/* Vuelo del póster → tarjeta */
.fly{position:fixed;z-index:500;overflow:hidden;border-radius:22px;pointer-events:none;background:#1c1c24;
  box-shadow:0 30px 70px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.18),0 0 60px rgba(255,69,58,.25);will-change:left,top,width,height,transform}
.fly img{width:100%;height:100%;object-fit:cover;object-position:center 25%;display:block}
.card.noanim{animation:none;opacity:1;transform:none}
.card.ghost{visibility:hidden}
.card.reveal{animation:settle .55s var(--spring)}
.card.reveal .meta{animation:metaIn .6s var(--ease) both}
@keyframes settle{from{transform:scale(.965)}to{transform:none}}
@keyframes metaIn{from{opacity:0;transform:translateY(14px)}}
.linkbtn{align-self:flex-start;color:var(--dim);font-size:.8rem;text-decoration:underline;text-underline-offset:3px;padding:2px 0}
/* Pestañas */
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:18px}
.tabs .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:14px;background:rgba(255,255,255,.16);box-shadow:0 4px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .55s var(--spring)}
.tabs[data-tab=watched] .ind{transform:translateX(100%)}
.tabs button{position:relative;z-index:1;padding:11px 8px;font-weight:700;font-size:.95rem;color:var(--dim);display:flex;align-items:center;justify-content:center;gap:8px;transition:color .3s}
.tabs button.on{color:var(--text)}
.tabs em{font-style:normal;font-size:.72rem;min-width:20px;padding:2px 6px;border-radius:99px;background:rgba(255,255,255,.14)}
.tabs button.bump{animation:pop .6s var(--spring)}.tabs button.bump em{background:#30d158;color:#04210c}
@keyframes pop{40%{transform:scale(1.14)}}
/* Buscador */
.searchwrap{max-width:560px;margin:6px auto 16px;padding:0 18px}
.search{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:18px;transition:box-shadow .3s}
.search:focus-within{box-shadow:0 0 0 4px rgba(255,69,58,.18),0 8px 32px rgba(0,0,0,.35)}
.search .mag{font-size:1.25rem;color:var(--dim);transform:scaleX(-1)}
.search input[type=search]{border:0;background:none;padding:15px 0;border-radius:0;box-shadow:none}
.search input[type=search]:focus{border:0;background:none;box-shadow:none}
.search input::-webkit-search-cancel-button{display:none}
.search button{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.16);font-size:.7rem;color:var(--dim)}
.grp{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:12px 4px -6px;opacity:0;animation:rise .6s var(--ease) forwards;animation-delay:calc(var(--i)*70ms)}
.grp.noanim{animation:none;opacity:1}
.card.seen>img{filter:saturate(.5) brightness(.8)}
.card.seen .chip{background:rgba(48,209,88,.22);color:#5df08a}
/* Scanned */
.scanbtn{flex:1 1 100%;display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(120deg,#30d158,#3ee06a);color:#04210c;font-size:1.02rem;box-shadow:0 12px 26px -10px rgba(48,209,88,.8)}
.scanbtn.undo{background:var(--glass);color:var(--text);box-shadow:none;border:1px solid var(--stroke);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.scanbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ticket.used img{opacity:.25;filter:grayscale(1)}
.ticket.used::after{content:"SCANNED";position:absolute;left:50%;top:57%;transform:translate(-50%,-50%) rotate(-14deg);border:4px solid #30d158;color:#1fa645;background:rgba(255,255,255,.75);font-weight:900;letter-spacing:.12em;font-size:1.5rem;padding:4px 16px;border-radius:12px}
#scan-fx{position:fixed;inset:0;z-index:450;display:none;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#scan-fx.on{display:block;animation:fadeIn .3s forwards}
#scan-fx.out{animation:fadeOut .6s forwards}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
#scan-fx .parts{position:absolute;left:50%;top:calc(50% - 30px)}
#scan-fx .parts i{position:absolute;left:0;top:0}
.fxl{position:absolute;left:0;right:0;top:calc(50% + 100px);text-align:center;opacity:0;transform:translateY(16px);animation:rise .6s .5s var(--spring) forwards}
.fxl .lbl{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}.fxl .sub{color:var(--dim);margin-top:4px;font-size:.9rem}
.stamp{position:absolute;left:50%;top:50%;width:58%;aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.stamp circle{fill:rgba(0,0,0,.55);stroke-width:4;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s .25s var(--ease) forwards}
.stamp path{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .35s .65s var(--ease) forwards}
.fly.yes .stamp *{stroke:#30d158}.fly.no .stamp *{stroke:#ff9f0a}
.fly.yes .xx,.fly.no .ck{display:none}
@keyframes draw{to{stroke-dashoffset:0}}
/* Toast */
#toast{position:fixed;left:50%;bottom:calc(var(--bot) + 30px);z-index:400;transform:translate(-50%,30px);padding:12px 20px;border-radius:99px;font-size:.9rem;font-weight:600;opacity:0;pointer-events:none;transition:.45s var(--spring);white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="ambient"><i></i><i></i><i></i></div>

<header class="top"><div class="hin">
  <div class="row1">
    <h1>Cine<b>Ticket</b></h1>
    <div class="hdr-actions">
      <button id="install-btn" class="icon-btn glass" onclick="installApp()" aria-label="Instalar">⤓</button>
      <button class="icon-btn glass" onclick="openWizard()" aria-label="Nueva entrada">＋</button>
    </div>
  </div>
  <nav class="tabs glass" id="tabs" data-tab="tickets">
    <i class="ind"></i>
    <button class="on" data-tab="tickets" onclick="setTab('tickets')"><span>Your Tickets</span><em id="c-tickets">0</em></button>
    <button data-tab="watched" onclick="setTab('watched')"><span>Watched</span><em id="c-watched">0</em></button>
  </nav>
</div></header>

<div class="searchwrap"><label class="search glass"><span class="mag">⌕</span>
  <input type="search" id="q" placeholder="Buscar película, cine o butaca" autocomplete="off" oninput="render(null,true)">
  <button id="q-x" onclick="clearQ()" aria-label="Borrar búsqueda" style="display:none">✕</button></label></div>
<main id="list"></main>
<div class="empty" id="empty"><div class="ico">🎟️</div><h2>Aún no hay entradas</h2><p>Toca ＋ y escribe el nombre de la película: el póster se agrega solo.</p></div>

<!-- Detalle -->
<section id="detail">
  <div class="d-bg" id="d-bg"></div>
  <button class="back icon-btn glass" onclick="closeDetail()" aria-label="Volver">✕</button>
  <div class="d-wrap">
    <div class="d-poster"><img id="d-img" alt=""></div>
    <h2 class="d-title" id="d-title"></h2>
    <div class="stagger">
      <div class="grid">
        <div class="pill glass wide"><span>Cine</span><div id="d-cine"></div></div>
        <div class="pill glass"><span>Sala</span><div id="d-hall"></div></div>
        <div class="pill glass"><span>Personas</span><div id="d-count"></div></div>
        <div class="pill glass wide"><span>Butacas</span><div id="d-seats"></div></div>
      </div>
      <div class="btns">
        <button class="btn scanbtn" id="scan-btn" onclick="toggleScanned()"><svg viewBox="0 0 24 24"><path id="scan-ico" d="M5 13l4 4L19 7"/></svg><span id="scan-lbl">Scanned</span></button>
        <button class="btn glass" onclick="editTicket()">Editar</button>
        <button class="btn glass danger" onclick="delTicket()">Borrar</button>
      </div>
      <div class="ticket" id="d-ticket" onclick="openQR()">
        <div class="top">CÓDIGO DE ACCESO</div>
        <img id="d-qr" alt="QR"><div class="hint" id="d-hint">TOCA PARA AMPLIAR</div>
      </div>
    </div>
  </div>
</section>

<!-- Asistente -->
<div class="overlay" id="wiz" onclick="if(event.target===this)closeWizard()">
  <div class="sheet glass">
    <div class="grab"></div>
    <h3 id="w-title">Nueva entrada</h3>
    <div class="dots"><i></i><i></i><i></i></div>

    <div class="step on" id="s1">
      <input type="search" id="m-name" placeholder="Nombre de la película" autocomplete="off" oninput="onName()">
      <div class="status" id="p-status">Escribe el nombre y buscaremos el póster automáticamente.</div>
      <div class="picker" id="picker"></div>
      <button class="linkbtn" onclick="setTmdb()">Mejorar la búsqueda con clave gratuita de TMDB (opcional)</button>
      <img class="prev" id="p-prev" alt="">
      <label class="drop" id="p-drop">🖼️ <span id="p-lbl">¿Prefieres subir tu propio póster?</span>
        <input type="file" id="m-img" hidden accept="image/*" onchange="pickFile(this,'poster')"></label>
      <button class="btn light" onclick="go(2)">Siguiente</button>
    </div>

    <div class="step" id="s2">
      <input type="text" id="m-cine" placeholder="Cine">
      <div class="row"><input type="number" id="m-count" placeholder="Personas" inputmode="numeric"><input type="number" id="m-hall" placeholder="Sala" inputmode="numeric"></div>
      <input type="text" id="m-seats" placeholder="Butacas (ej. F7, F8)">
      <div class="row"><button class="btn glass" onclick="go(1)">Atrás</button><button class="btn light" onclick="go(3)">Siguiente</button></div>
    </div>

    <div class="step" id="s3">
      <img class="qrprev" id="q-prev" alt="">
      <label class="drop" id="q-drop">▦ <span id="q-lbl">Subir código QR</span>
        <input type="file" id="m-qr" hidden accept="image/*" onchange="pickFile(this,'qr')"></label>
      <div class="row"><button class="btn glass" onclick="go(2)">Atrás</button><button class="btn main" id="save-btn" onclick="save()">Guardar</button></div>
    </div>
    <button class="cancel" onclick="closeWizard()">Cancelar</button>
  </div>
</div>

<div id="qr-full" onclick="closeQR()"><img id="qr-big" alt="QR"><p>TOCA PARA CERRAR</p></div>
<div id="scan-fx"><div class="parts"></div><div class="fxl"><div class="lbl"></div><div class="sub"></div></div></div>
<div id="toast" class="glass"></div>

<script>
const KEY='cinepass_final'; // misma clave que v1: tus entradas actuales se conservan
let tickets=[];try{tickets=JSON.parse(localStorage.getItem(KEY))||[]}catch{}
let curId=null, wiz={poster:null,qr:null}, wakeLock=null, timer, reqN=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(tickets));return true}catch{toast('Almacenamiento lleno');return false}};

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200)}

/* ---------- Lista ---------- */
const LBL={tickets:'Your Tickets',watched:'Watched',scanned:'Scanned',notScanned:'Not Scanned'};
let tab='tickets',holdCounts=false,moving=false;
const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const fmtD=ts=>new Date(ts).toLocaleDateString('es',{day:'numeric',month:'short'}).replace('.','');
const monthLabel=ts=>{if(!ts)return'Sin fecha';const m=new Date(ts).toLocaleDateString('es',{month:'long',year:'numeric'});return m.charAt(0).toUpperCase()+m.slice(1)};
function updateCounts(){$('c-tickets').textContent=tickets.filter(t=>!t.watched).length;$('c-watched').textContent=tickets.filter(t=>t.watched).length}
function syncTabs(){$('tabs').dataset.tab=tab;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab))}
function setTab(t){if(t===tab)return;tab=t;syncTabs();scrollTo({top:0});render()}
function clearQ(){$('q').value='';render(null,true);$('q').focus()}
function render(ghostId,still){
  const l=$('list');l.innerHTML='';
  const qv=$('q').value.trim(),q=norm(qv);$('q-x').style.display=qv?'':'none';
  let list=tickets.filter(t=>!!t.watched===(tab==='watched'));
  if(q)list=list.filter(t=>norm([t.name,t.cine,t.seats,t.hall].join(' ')).includes(q));
  if(tab==='watched')list.sort((a,b)=>(b.watchedAt||0)-(a.watchedAt||0));
  const em=$('empty');em.style.display=list.length?'none':'block';
  if(!list.length){
    const [i,h,p]=qv?['🔍','Sin resultados',`No hay coincidencias para “${esc(qv)}”.`]:
      tab==='watched'?['🍿','Aún no hay películas vistas','Abre una entrada y toca “'+LBL.scanned+'” cuando entres a la sala.']:
      ['🎟️','Aún no hay entradas','Toca ＋ y escribe el nombre de la película: el póster se agrega solo.'];
    em.innerHTML=`<div class="ico">${i}</div><h2>${h}</h2><p>${p}</p>`;
  }
  let n=0,last='';
  list.forEach(t=>{
    if(tab==='watched'){const g=monthLabel(t.watchedAt);if(g!==last){last=g;const h=document.createElement('h2');h.className='grp'+(still?' noanim':'');h.style.setProperty('--i',n++);h.textContent=g;l.appendChild(h)}}
    const c=document.createElement('div');c.className='card'+(still?' noanim':'')+(t.id===ghostId?' ghost':'')+(t.watched?' seen':'');
    c.style.setProperty('--i',n++);c.dataset.id=t.id;c.onclick=()=>openDetail(t.id);
    c.innerHTML=(t.poster?`<img src="${esc(t.poster)}" alt="" loading="lazy">`:'<div class="noimg">🎬</div>')+
      `<div class="meta glass"><div><div class="t">${esc(t.name)}</div><div class="s">${esc(t.cine)}</div></div><span class="chip">${t.watched?'✓ '+fmtD(t.watchedAt):'Sala '+esc(t.hall)}</span></div>`;
    l.appendChild(c);
  });
  if(!holdCounts)updateCounts();
}

/* ---------- Detalle ---------- */
function openDetail(id){
  const t=tickets.find(x=>x.id===id);if(!t)return;curId=id;
  $('d-title').textContent=t.name;$('d-cine').textContent=t.cine;$('d-hall').textContent=t.hall;
  $('d-count').textContent=t.count;$('d-seats').textContent=t.seats;
  $('d-img').src=t.poster||'';$('d-bg').style.backgroundImage=t.poster?`url("${t.poster}")`:'none';
  $('d-qr').src=t.qr||'';$('d-ticket').classList.toggle('none',!t.qr);$('d-ticket').classList.toggle('used',!!t.watched);
  $('scan-lbl').textContent=t.watched?LBL.notScanned:LBL.scanned;$('scan-btn').classList.toggle('undo',!!t.watched);
  $('scan-ico').setAttribute('d',t.watched?'M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3':'M5 13l4 4L19 7');
  $('d-hint').textContent=t.qr?'TOCA PARA AMPLIAR':'SIN CÓDIGO QR · EDITA PARA AGREGARLO';
  $('detail').scrollTop=0;$('detail').classList.add('on');document.body.style.overflow='hidden';
}
function closeDetail(){$('detail').classList.remove('on');document.body.style.overflow=''}
function delTicket(){
  if(!confirm('¿Eliminar esta entrada?'))return;
  tickets=tickets.filter(t=>t.id!==curId);persist();render(null,true);closeDetail();toast('Entrada eliminada');
}
async function openQR(){
  if(!$('d-qr').src||$('d-ticket').classList.contains('none'))return;
  $('qr-big').src=$('d-qr').src;$('qr-full').classList.add('on');
  try{wakeLock=await navigator.wakeLock?.request('screen')}catch{}
}
function closeQR(){$('qr-full').classList.remove('on');wakeLock?.release().catch(()=>{});wakeLock=null}

/* ---------- Asistente ---------- */
function openWizard(edit){
  wiz={poster:null,qr:null};
  ['m-name','m-cine','m-count','m-hall','m-seats'].forEach(i=>$(i).value='');
  $('picker').innerHTML='';$('p-status').textContent='Escribe el nombre y buscaremos el póster automáticamente.';
  setPrev('p-prev',null);setPrev('q-prev',null);
  $('p-drop').classList.remove('ok');$('q-drop').classList.remove('ok');
  $('p-lbl').textContent='¿Prefieres subir tu propio póster?';$('q-lbl').textContent='Subir código QR';
  $('w-title').textContent='Nueva entrada';
  if(edit){
    const t=tickets.find(x=>x.id===curId);wiz={poster:t.poster,qr:t.qr};
    $('m-name').value=t.name;$('m-cine').value=t.cine==='Cine Local'?'':t.cine;
    $('m-count').value=t.count;$('m-hall').value=t.hall==='-'?'':t.hall;$('m-seats').value=t.seats==='-'?'':t.seats;
    setPrev('p-prev',t.poster);setPrev('q-prev',t.qr);$('w-title').textContent='Editar entrada';
    $('p-status').textContent='Cambia el nombre para buscar otro póster.';
  }
  go(1);$('wiz').classList.add('on');
  if(!edit)setTimeout(()=>$('m-name').focus(),450);
}
function closeWizard(){$('wiz').classList.remove('on');document.activeElement?.blur()}
function editTicket(){openWizard(true)}
function go(n){
  document.querySelectorAll('.step').forEach(s=>s.classList.remove('on'));$('s'+n).classList.add('on');
  document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('done',i<n));
}
function setPrev(id,src){const e=$(id);e.classList.toggle('on',!!src);if(src)e.src=src}

/* ---------- Póster automático: TMDB (opcional) + iTunes + Wikipedia, en paralelo ---------- */
const TMDB_KEY='cineticket_tmdb';
const tmo=(p,ms=8000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
function setTmdb(){
  const v=prompt('Pega tu clave de TMDB (API key v3 o token de lectura). Vacío para quitarla:',localStorage.getItem(TMDB_KEY)||'');
  if(v===null)return;v.trim()?localStorage.setItem(TMDB_KEY,v.trim()):localStorage.removeItem(TMDB_KEY);onName();
}
function onName(){
  clearTimeout(timer);const q=$('m-name').value.trim();
  if(q.length<2){$('picker').innerHTML='';return}
  $('p-status').innerHTML='<span class="spin"></span>Buscando póster…';
  timer=setTimeout(()=>findPosters(q),450);
}
function jsonp(url){return new Promise((res,rej)=>{
  const cb='cb'+Date.now()+Math.floor(Math.random()*1e4),s=document.createElement('script');
  window[cb]=d=>{res(d);s.remove();delete window[cb]};s.onerror=()=>{rej(new Error('jsonp'));s.remove()};
  s.src=url+'&callback='+cb;document.head.appendChild(s)})}

async function pTMDB(q){
  const k=localStorage.getItem(TMDB_KEY);if(!k)return[];
  const bearer=k.length>40;
  const u=`https://api.themoviedb.org/3/search/movie?include_adult=false&language=es-ES&query=${encodeURIComponent(q)}`+(bearer?'':'&api_key='+k);
  const d=await (await fetch(u,bearer?{headers:{Authorization:'Bearer '+k}}:{})).json();
  return (d.results||[]).filter(x=>x.poster_path).slice(0,8).map(x=>({title:x.title,year:(x.release_date||'').slice(0,4),url:'https://image.tmdb.org/t/p/w500'+x.poster_path}));
}
async function pItunes(q){
  const region=(navigator.language.split('-')[1]||'US').toUpperCase();
  const run=async c=>{
    const u=`https://itunes.apple.com/search?media=movie&entity=movie&limit=8&country=${c}&term=${encodeURIComponent(q)}`;
    let d;try{d=await (await fetch(u)).json()}catch{d=await jsonp(u)}return d.results||[]};
  let r=await run(region);if(!r.length&&region!=='US')r=await run('US');
  return r.filter(x=>x.artworkUrl100).map(x=>({title:x.trackName,year:(x.releaseDate||'').slice(0,4),url:x.artworkUrl100.replace(/\d+x\d+bb/,'500x750bb')}));
}
async function pWiki(q){
  const one=async(lang,suf)=>{
    const u=`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=8&prop=pageimages&piprop=thumbnail&pithumbsize=500&gsrsearch=${encodeURIComponent(q+' '+suf)}`;
    const d=await (await fetch(u)).json();
    return Object.values(d.query?.pages||{}).filter(p=>p.thumbnail).sort((a,b)=>a.index-b.index).map(p=>({title:p.title,year:'',url:p.thumbnail.source}))};
  const r=await Promise.allSettled([one('es','película'),one('en','film')]);
  if(r.every(x=>x.status==='rejected'))throw r[0].reason;
  return r.flatMap(x=>x.value||[]);
}
async function findPosters(q){
  const n=++reqN,seen=new Set(),p=$('picker');p.innerHTML='';
  let pending=3,failed=0,count=0;
  const done=()=>{ if(--pending>0||n!==reqN)return;
    if(count)return;
    $('p-status').textContent=failed===3?'No pudimos conectar con los buscadores de pósters. Revisa tu conexión o sube uno propio.':'Sin resultados. Prueba otro nombre o sube el póster.';};
  [pTMDB,pItunes,pWiki].forEach(fn=>tmo(fn(q)).then(list=>{
    if(n!==reqN)return;
    list.forEach(it=>{
      if(seen.has(it.url))return;seen.add(it.url);
      const b=document.createElement('button');b.style.setProperty('--i',count);b.title=it.title+(it.year?` (${it.year})`:'');
      const im=new Image();im.referrerPolicy='no-referrer';im.alt='';im.src=it.url;im.onerror=()=>b.remove();b.appendChild(im);
      b.onclick=()=>choose(it,b);p.appendChild(b);
      if(count++===0&&!wiz.manual)choose(it,b);
    });
  }).catch(e=>{failed++;console.warn('Póster:',fn.name,e)}).finally(done));
}
async function choose(it,btn){
  wiz.manual=false;
  document.querySelectorAll('.picker button').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');
  $('p-status').textContent=it.title+(it.year?` (${it.year})`:'');
  wiz.poster=it.url;setPrev('p-prev',it.url);
  try{ // copia local para uso sin internet
    const blob=await (await fetch(it.url)).blob();
    const d=await shrink(blob,700,'image/jpeg',.86);
    if(wiz.poster===it.url){wiz.poster=d;setPrev('p-prev',d)}
  }catch{/* si el CORS falla se guarda la URL y el service worker la cachea */}
}

/* ---------- Archivos ---------- */
async function shrink(blob,max,type,q){
  const bmp=await createImageBitmap(blob),k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  const x=c.getContext('2d');if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
  x.drawImage(bmp,0,0,c.width,c.height);return c.toDataURL(type,q);
}
async function pickFile(inp,kind){
  const f=inp.files[0];if(!f)return;
  try{
    if(kind==='poster'){wiz.manual=true;wiz.poster=await shrink(f,700,'image/jpeg',.86);setPrev('p-prev',wiz.poster);$('p-drop').classList.add('ok');$('p-lbl').textContent='Póster propio cargado ✓';
      document.querySelectorAll('.picker button').forEach(b=>b.classList.remove('sel'))}
    else{wiz.qr=await shrink(f,1000,'image/png');setPrev('q-prev',wiz.qr);$('q-drop').classList.add('ok');$('q-lbl').textContent='QR cargado ✓'}
  }catch{toast('No se pudo leer la imagen')}
}

let saving=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function save(){
  if(saving)return;
  const name=$('m-name').value.trim();
  if(!name){go(1);$('m-name').focus();return toast('Escribe el nombre de la película')}
  const editing=$('w-title').textContent.startsWith('Editar');
  const t={id:editing?curId:Date.now(),name,
    cine:$('m-cine').value.trim()||'Cine Local',count:$('m-count').value||'1',hall:$('m-hall').value||'-',
    seats:$('m-seats').value.trim()||'-',poster:wiz.poster,qr:wiz.qr};
  const i=tickets.findIndex(x=>x.id===t.id);
  if(i>=0){t.watched=tickets[i].watched||false;t.watchedAt=tickets[i].watchedAt||0}
  tab=t.watched?'watched':'tickets';syncTabs();$('q').value='';
  if(i>=0)tickets[i]=t;else tickets.push(t);
  if(!persist())return;
  saving=true;
  closeWizard();closeDetail();
  render(t.id,true);                                   // la tarjeta nueva queda oculta ("fantasma")
  const card=document.querySelector(`.card[data-id="${t.id}"]`);
  card.scrollIntoView({block:'center'});
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    if(matchMedia('(prefers-reduced-motion:reduce)').matches)throw 0;
    const R=card.getBoundingClientRect();
    const f=document.createElement('div');f.className='fly';
    f.innerHTML=t.poster?`<img src="${esc(t.poster)}" alt="">`:'<div class="noimg" style="z-index:0">🎬</div>';
    document.body.appendChild(f);
    const W=Math.min(innerWidth*.56,240),H=W*1.5,L=(innerWidth-W)/2,T=(innerHeight-H)/2-10;
    Object.assign(f.style,{left:L+'px',top:T+'px',width:W+'px',height:H+'px'});
    await f.animate([{transform:'scale(.5) rotate(-4deg)',opacity:0},{transform:'scale(1.05)',opacity:1,offset:.7},{transform:'scale(1)',opacity:1}],
      {duration:560,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'}).finished;
    await sleep(260);
    await f.animate([{left:L+'px',top:T+'px',width:W+'px',height:H+'px',borderRadius:'22px'},
                     {left:R.left+'px',top:R.top+'px',width:R.width+'px',height:R.height+'px',borderRadius:'26px'}],
      {duration:720,easing:'cubic-bezier(.65,0,.2,1)',fill:'forwards'}).finished;
    card.classList.remove('ghost');card.classList.add('reveal');
    requestAnimationFrame(()=>f.remove());
  }catch{card.classList.remove('ghost')}
  saving=false;toast('Entrada guardada ✓');
}

/* ---------- Scanned / Not Scanned ---------- */
function burst(c,yes){
  c.innerHTML='';const cols=yes?['#30d158','#ffd60a','#fff','#64d2ff','#ff9f0a']:['#ff9f0a','#ff453a','#fff'];
  for(let i=0;i<(yes?24:10);i++){
    const p=document.createElement('i'),a=Math.random()*6.283,r=110+Math.random()*100,z=5+Math.random()*6;
    p.style.cssText=`width:${z}px;height:${z}px;background:${cols[i%cols.length]};border-radius:${Math.random()>.5?'50%':'2px'}`;c.appendChild(p);
    p.animate([{transform:'translate(0,0) scale(.3)',opacity:1},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) rotate(${Math.random()*540}deg) scale(1)`,opacity:0}],
      {duration:900+Math.random()*300,delay:420,easing:'cubic-bezier(.15,.7,.3,1)',fill:'both'});
  }
}
async function toggleScanned(){
  if(moving)return;const t=tickets.find(x=>x.id===curId);if(!t)return;
  moving=true;const to=!t.watched;
  t.watched=to;t.watchedAt=to?Date.now():0;
  if(!persist()){t.watched=!to;t.watchedAt=0;moving=false;return}
  const msg=to?'Movie moved to '+LBL.watched:'Movie back in '+LBL.tickets;
  holdCounts=true;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){closeDetail();render(null,true);holdCounts=false;updateCounts();toast(msg);moving=false;return}
  const fx=$('scan-fx');fx.className='on';
  fx.querySelector('.lbl').textContent=to?LBL.scanned+' ✓':LBL.notScanned;
  fx.querySelector('.sub').textContent=to?'Moving to '+LBL.watched+'…':'Moving back to '+LBL.tickets+'…';
  burst(fx.querySelector('.parts'),to);
  // póster con sello en el centro
  const f=document.createElement('div');f.className='fly '+(to?'yes':'no');
  f.innerHTML=(t.poster?`<img src="${esc(t.poster)}" alt="">`:'<div class="noimg" style="z-index:0">🎬</div>')+
    '<svg class="stamp" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" pathLength="1"/><path class="ck" d="M19 33l9 9 17-19" pathLength="1"/><path class="xx" d="M22 22l20 20M42 22L22 42" pathLength="1"/></svg>';
  const W=120,H=180,X=(innerWidth-W)/2,Y=(innerHeight-H)/2-30;
  Object.assign(f.style,{left:X+'px',top:Y+'px',width:W+'px',height:H+'px',borderRadius:'18px'});document.body.appendChild(f);
  await f.animate([{transform:'scale(.5)',opacity:0},{transform:'scale(1.08)',opacity:1,offset:.7},{transform:'scale(1)',opacity:1}],{duration:460,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'}).finished;
  await sleep(1000);
  // vuelo hacia la pestaña de destino
  const tb=document.querySelector(`.tabs button[data-tab="${to?'watched':'tickets'}"]`);
  fx.classList.add('out');closeDetail();render(null,true);
  const r=tb.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  await f.animate([{left:X+'px',top:Y+'px',width:W+'px',height:H+'px',borderRadius:'18px',opacity:1},
                   {left:cx-13+'px',top:cy-19+'px',width:'26px',height:'38px',borderRadius:'6px',opacity:.85}],
    {duration:720,easing:'cubic-bezier(.6,0,.25,1)',fill:'forwards'}).finished;
  f.remove();fx.className='';holdCounts=false;updateCounts();
  tb.classList.remove('bump');void tb.offsetWidth;tb.classList.add('bump');setTimeout(()=>tb.classList.remove('bump'),700);
  toast(msg);moving=false;
}

/* ---------- PWA ---------- */
let deferred;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install-btn').style.display='grid'});
async function installApp(){if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('install-btn').style.display='none'}
addEventListener('appinstalled',()=>{$('install-btn').style.display='none';toast('CineTicket instalada 🎬')});
addEventListener('offline',()=>toast('Sin conexión · tus entradas siguen disponibles'));
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
addEventListener('keydown',e=>{if(e.key==='Escape'){closeQR();closeWizard();closeDetail()}});

render();
</script>
</body>
